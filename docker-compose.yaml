#    networks:
#      - bookmark_network
#    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: bookmark_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - bookmark_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  bookmark_network:
    driver: bridge
