version: '3.8'

services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: bookmark_postgres
    environment:
      POSTGRES_DB: bookmark_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookmark_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmark_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/bookmark_manager
      - SERVER_PORT=8000
      - RUST_LOG=info
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 2 &&
        diesel migration run &&
        echo 'Starting bookmark manager...' &&
        ./bookmark_manager
      "
    volumes:
      - ./backend/migrations:/app/migrations
    networks:
      - bookmark_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: bookmark_frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - bookmark_network
    restart: unless-stopped

