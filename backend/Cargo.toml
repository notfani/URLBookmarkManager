[package]
name = "bookmark_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-cors = "0.6"
diesel = { version = "2.0", features = ["postgres", "r2d2", "chrono", "uuid"] }
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
thiserror = "1.0"
log = "0.4"
bcrypt = "0.15"
jsonwebtoken = "9.0"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }