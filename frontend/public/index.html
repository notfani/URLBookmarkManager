<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bookmark Manager</h1>
            <div id="userInfo" class="user-info" style="display: none;">
                <span id="username"></span>
                <button id="logoutBtn" class="logout-btn">Выход</button>
            </div>
        </header>

        <main>
            <section class="add-bookmark-section">
                <h2>Добавить закладку</h2>
                <form id="addBookmarkForm">
                    <div class="form-group">
                        <label for="title">Название:</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="url">URL:</label>
                        <input type="url" id="url" name="url" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Описание:</label>
                        <textarea id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="category_id">Категория:</label>
                        <select id="category_id" name="category_id" required>
                            <option value="">Выберите категорию...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Добавить закладку</button>
                </form>
            </section>

            <section class="category-section">
                <h2>Управление категориями</h2>
                <div class="category-controls">
                    <input type="text" id="newCategoryName" placeholder="Название новой категории">
                    <button id="addCategoryBtn" class="btn btn-secondary">Добавить категорию</button>
                </div>
            </section>

            <section class="controls-section">
                <div class="controls">
                    <input type="text" id="searchInput" placeholder="Поиск закладок...">
                    <select id="categoryFilter">
                        <option value="">Все категории</option>
                    </select>
                </div>
            </section>

            <section class="bookmarks-section">
                <h2>Мои закладки</h2>
                <div id="bookmarksList" class="bookmarks-list">
                    <p class="loading">Загрузка...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
