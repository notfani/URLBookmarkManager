<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Bookmark Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1>Bookmark Manager</h1>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <form id="loginForm" class="auth-form active">
                <h2>Войти в систему</h2>
                <div class="form-group">
                    <label for="loginUsername">Имя пользователя:</label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль:</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
                <div id="loginError" class="error-message"></div>
            </form>

            <form id="registerForm" class="auth-form">
                <h2>Создать аккаунт</h2>
                <div class="form-group">
                    <label for="registerUsername">Имя пользователя:</label>
                    <input type="text" id="registerUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label for="registerFullName">Полное имя (необязательно):</label>
                    <input type="text" id="registerFullName" name="full_name">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль:</label>
                    <input type="password" id="registerPassword" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm">Подтвердите пароль:</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                <div id="registerError" class="error-message"></div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
